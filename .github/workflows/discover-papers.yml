name: Discover high-quality papers

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build venue-balanced paper queue
        run: python scripts/discover_papers.py

      - name: Commit queue and BibTeX
        run: |
          if git diff --quiet -- reading_queue.md bib/discovered.bib; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading_queue.md bib/discovered.bib
          git commit -m "Refresh venue-balanced paper queue"
          git push
