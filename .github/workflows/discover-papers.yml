name: Discover latest papers

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover and rank recent papers
        run: python scripts/discover_papers.py

      - name: Commit queue and BibTeX
        run: |
          if git diff --quiet -- reading_queue.md data/seen_papers.json bib/discovered.bib; then
            echo "No new matching papers."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reading_queue.md data/seen_papers.json bib/discovered.bib
          git commit -m "Refresh paper discovery queue"
          git push
